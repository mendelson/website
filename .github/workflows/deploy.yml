name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Builds AND checks the output (see tools/check_build.py): a leftover
      # {{PLACEHOLDER}}, a missing page/redirect/short link, or a tracked
      # short link that lost its measurement fails here rather than shipping.
      # Same command a developer runs locally, so the two cannot drift.
      - name: Build site + check output
        run: python3 tools/check_build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
